<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:">
<title>Rank overview</title>
<style>
  :root { --fg: #f8fafc; --muted: #94a3b8; --dim: #64748b; --line: rgba(255,255,255,0.08); --up: #22c55e; --down: #ef4444; --warn: #f59e0b; --info: #60a5fa; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; height: 100%; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; color: var(--fg); font-size: 13px; -webkit-user-select: none; user-select: none; }
  #card { height: 100%; background: rgba(15, 23, 42, 0.97); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,0.45); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }

  /* toolbar */
  #bar { display: flex; align-items: center; justify-content: space-between; }
  #refresh { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 999px; border: none; background: #2563eb; color: #fff; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  #refresh:hover { background: #1d4ed8; }
  #refresh:disabled { background: #334155; color: #cbd5e1; cursor: default; }
  #refresh svg { width: 14px; height: 14px; }
  #barRight { display: flex; align-items: center; gap: 8px; }
  #updated { font-size: 11px; color: var(--muted); }
  #close { width: 28px; height: 28px; border-radius: 8px; border: none; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; }
  #close:hover { background: rgba(255,255,255,0.1); color: var(--fg); }
  #err { color: #fca5a5; font-size: 11px; margin-top: -8px; }

  /* hero */
  #hero { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0 2px; }
  #badge { width: 84px; height: 84px; }
  #badge img, #badge svg { width: 100%; height: 100%; display: block; }
  #title { font-size: 18px; font-weight: 700; letter-spacing: 0.01em; }
  #mmrLine { display: flex; align-items: baseline; gap: 8px; }
  #mmr { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  #mmrUnit { font-size: 12px; color: var(--muted); }
  #sub { font-size: 12.5px; font-weight: 700; }
  #sub.up { color: var(--up); } #sub.down { color: var(--down); } #sub.flat { color: var(--muted); font-weight: 500; }
  #progress { width: 100%; display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
  #track { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, #22c55e, #60a5fa); border-radius: 3px; transition: width .4s; }
  #next { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

  h3 { margin: 0; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .section { display: flex; flex-direction: column; gap: 8px; }

  /* parts */
  #parts { display: flex; flex-direction: column; gap: 7px; }
  .part { display: grid; grid-template-columns: 92px minmax(0, 1fr) 44px 42px; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
  .part .label { font-size: 12px; }
  .part .track { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.06); overflow: hidden; }
  .part .track div { height: 100%; border-radius: 4px; }
  .part .val { font-size: 12px; font-weight: 700; text-align: right; }
  .delta { font-size: 11px; font-weight: 700; text-align: right; }
  .delta.up { color: var(--up); } .delta.down { color: var(--down); } .delta.flat { color: var(--muted); }

  /* days */
  .row { display: grid; grid-template-columns: minmax(0, 1fr) 56px 44px 44px 44px; gap: 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .row > div { text-align: right; color: var(--muted); }
  .row > div:first-child { text-align: left; color: var(--fg); font-weight: 600; }
  .row .tir { font-weight: 700; color: var(--fg); }
  .row.head { font-size: 10.5px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .row.head > div { color: var(--dim); font-weight: 500; }
  .row .lowbad { color: var(--down); }
  .row .good { color: var(--up); }
  .soFar { font-size: 10px; color: var(--dim); font-weight: 400; }
  #empty { color: var(--muted); text-align: center; padding: 12px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="card">
    <div id="bar">
      <button id="refresh" type="button" title="Fetch the latest readings and recompute the rank now">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 3v6h-6"></path></svg>
        <span id="refreshText">Refresh rank</span>
      </button>
      <div id="barRight"><span id="updated"></span><button id="close" title="Close (Esc)">&#215;</button></div>
    </div>
    <div id="err" hidden></div>

    <div id="hero">
      <div id="badge"></div>
      <div id="title">Unranked</div>
      <div id="mmrLine"><span id="mmr">--</span><span id="mmrUnit">MMR</span></div>
      <div id="sub" class="flat"></div>
      <div id="progress">
        <div id="track"><div id="fill"></div></div>
        <div id="next"><span id="nextLeft"></span><span id="nextRight"></span></div>
      </div>
    </div>

    <div id="empty" hidden>Not enough readings yet. The rank needs about five hours of data.</div>

    <div class="section" id="partsSection">
      <h3>Where the points come from</h3>
      <div id="parts"></div>
    </div>

    <div class="section" id="daysSection">
      <h3>Day by day</h3>
      <div class="row head"><div></div><div>In range</div><div>Low</div><div>High</div><div>Avg</div></div>
      <div id="days" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
  </div>
  <script src="overview.js"></script>
</body>
</html>
