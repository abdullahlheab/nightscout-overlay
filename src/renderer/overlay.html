<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' file: data:; img-src 'self' file: data:">
<title>Nightscout Overlay</title>
<style>
  :root {
    --fg: #f8fafc;
    --muted: #cbd5e1;
    --bg: rgba(15, 23, 42, 0.92);
    --border: rgba(255,255,255,0.08);
    --shadow: 0 4px 16px rgba(0,0,0,0.35);
    --band: rgba(34,197,94,0.14);
    --halo: rgba(0,0,0,0.55);
    --c-ok: #22c55e; --c-warn: #f59e0b; --c-urgent: #ef4444; --c-stale: #94a3b8; --c-info: #60a5fa;
    --accent: var(--c-ok);
    font-size: 16px;
  }
  /* light card: dark text, deeper state colours so they hold up on white */
  body[data-theme="light"] {
    --fg: #0f172a; --muted: #475569;
    --bg: rgba(255, 255, 255, var(--bg-alpha));
    --border: rgba(0,0,0,0.12);
    --shadow: 0 4px 16px rgba(0,0,0,0.18);
    --band: rgba(22,163,74,0.14);
    --halo: rgba(255,255,255,0.85);
    --c-ok: #15803d; --c-warn: #b45309; --c-urgent: #dc2626; --c-stale: #64748b; --c-info: #1d4ed8;
  }
  /* glass: the OS blurs what is behind, so the card itself can be almost clear */
  body[data-theme="glass"] { --bg: rgba(15, 23, 42, calc(var(--bg-alpha) * 0.5)); }
  /* the OS paints acrylic over the whole rectangular window, so the card matches it: no radius, no border */
  body[data-theme="glass"] #card { border-radius: 0; border-color: transparent; box-shadow: none; }
  /* none: no card at all, just the readout with a halo */
  body[data-theme="none"] { --bg: transparent; --border: transparent; --shadow: none; }
  body[data-theme="none"] #card { background: transparent; border-color: transparent; box-shadow: none; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    color: var(--fg);
    -webkit-user-select: none;
    user-select: none;
    -webkit-app-region: drag;
    cursor: move;
  }
  #card {
    position: relative;
    width: 100%; height: 100%;
    background: var(--bg);
    border-radius: 0.75rem;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 0.4rem 0.6rem 0.35rem;
    display: flex; flex-direction: column;
    transition: border-color .3s;
  }
  #card.in-range   { --accent: var(--c-ok); }
  #card.low, #card.high { --accent: var(--c-warn); }
  #card.urgent-low, #card.urgent-high { --accent: var(--c-urgent); animation: pulse 1.2s ease-in-out infinite; }
  #card.stale, #card.error { --accent: var(--c-stale); }
  /* halo: a soft outline in the opposite tone so text reads on any backdrop */
  body.halo #bg, body.halo #arrow, body.halo #meta, body.halo #err, body.halo #alertText, body.halo #updateText {
    text-shadow: 0 0 3px var(--halo), 0 0 7px var(--halo), 0 1px 2px var(--halo);
  }
  #card.stale #bg, #card.error #bg { color: var(--muted); }
  @keyframes pulse { 0%,100% { border-color: rgba(239,68,68,.25); } 50% { border-color: rgba(239,68,68,.9); } }

  #top { display: flex; align-items: baseline; gap: 0.4rem; line-height: 1; flex: none; }
  #bg { font-size: 2.1rem; font-weight: 700; letter-spacing: -0.02em; color: var(--accent); font-variant-numeric: tabular-nums; }
  #arrow { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  #meta { display: flex; gap: 0.55rem; font-size: 0.72rem; color: var(--muted); margin-top: 0.25rem; white-space: nowrap; overflow: hidden; flex: none; }
  #delta { font-variant-numeric: tabular-nums; }
  #err { font-size: 0.66rem; color: #fca5a5; margin-top: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* explicit CSS size: a canvas with no CSS height grows to its pixel-buffer height on HiDPI screens */
  #graph { flex: none; display: block; width: 100%; height: 2.2rem; margin-top: 0.3rem; }

  /* rank row: badge, tier and division, time in range */
  #rankRow { flex: none; display: flex; align-items: center; gap: 0.45rem; height: 1.8rem; margin-top: 0.1rem; }
  #rankRow.hidden { display: none; }
  #rankBadge { width: 1.8rem; height: 1.8rem; flex: none; display: flex; align-items: center; justify-content: center; }
  #rankBadge svg, #rankBadge img { width: 100%; height: 100%; display: block; overflow: visible; }
  #rankBadge img { image-rendering: auto; object-fit: contain; }
  #rankBadge.px img { image-rendering: pixelated; }   /* the built-in icons are 16px: crisp pixel art when large */
  #rankBadge.legend svg { filter: drop-shadow(0 0 0.18rem rgba(255, 220, 120, 0.9)); }
  #rankName { font-size: 0.8rem; font-weight: 700; color: var(--fg); white-space: nowrap; }
  body.halo #rankName { text-shadow: 0 0 3px var(--halo), 0 0 7px var(--halo); }
  #graph.hidden { display: none; }

  #menu {
    -webkit-app-region: no-drag;
    position: absolute; top: 0.2rem; right: 0.35rem;
    width: 1.25rem; height: 1.25rem; border-radius: 0.3rem;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 0.9rem; line-height: 1; cursor: pointer;
    opacity: 0; transition: opacity .15s, background .15s;
  }
  body:hover #menu { opacity: 1; }
  #menu:hover { background: rgba(255,255,255,0.12); color: var(--fg); }
  body.click-through #menu { display: none; }

  #grip {
    -webkit-app-region: no-drag;
    position: absolute; right: 0; bottom: 0;
    width: 1rem; height: 1rem; cursor: nwse-resize;
    opacity: 0; transition: opacity .15s;
    touch-action: none;
  }
  #grip::after {
    content: ""; position: absolute; right: 0.25rem; bottom: 0.25rem;
    width: 0.45rem; height: 0.45rem;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    border-radius: 0 0 2px 0;
  }
  body:hover #grip { opacity: 0.8; }
  body.click-through #grip { display: none; }

  #alertBar {
    flex: none; display: flex; align-items: center; gap: 0.4rem;
    margin-top: 0.3rem; height: 1.5rem;
  }
  #alertBar.hidden { display: none; }
  #alertText { flex: 1; font-size: 0.72rem; font-weight: 700; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ack {
    -webkit-app-region: no-drag; cursor: pointer;
    font: inherit; font-size: 0.68rem; font-weight: 600; line-height: 1;
    padding: 0.3rem 0.55rem; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.12); color: var(--fg);
  }
  #ack:hover { background: rgba(255,255,255,0.22); }
  #updateBar {
    flex: none; display: flex; align-items: center; gap: 0.35rem;
    margin-top: 0.3rem; height: 1.5rem;
  }
  #updateBar.hidden { display: none; }
  #updateText { flex: 1; font-size: 0.68rem; font-weight: 600; color: #93c5fd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #updateBar button {
    -webkit-app-region: no-drag; cursor: pointer;
    font: inherit; font-size: 0.64rem; font-weight: 600; line-height: 1;
    padding: 0.3rem 0.5rem; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.12); color: var(--fg);
  }
  #updateBar button:hover { background: rgba(255,255,255,0.22); }
  #updateGo { background: #2563eb; border-color: #2563eb; }
  #updateGo:hover { background: #1d4ed8; }
  #card.alerting { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent), 0 4px 16px rgba(0,0,0,0.35); }
  #card.alerting.stale { --accent: var(--c-info); }
  #card.alerting.flash { animation: flash 1.2s ease-in-out infinite; }
  @keyframes flash {
    0%, 100% { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent), 0 4px 16px rgba(0,0,0,0.35); }
    50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 70%, transparent), 0 4px 16px rgba(0,0,0,0.35); }
  }
</style>
</head>
<body>
  <div id="card" class="error">
    <div id="top">
      <span id="bg">--</span>
      <span id="arrow"></span>
    </div>
    <div id="meta">
      <span id="delta"></span>
      <span id="age"></span>
    </div>
    <div id="err"></div>
    <div id="rankRow" class="hidden" title="Glucose rank: time in range over the last 3 days"><span id="rankBadge"></span><span id="rankName"></span></div>
    <canvas id="graph"></canvas>
    <div id="alertBar" class="hidden"><span id="alertText"></span><button id="ack" type="button" title="Dismiss and snooze this alert">I see it</button></div>
    <div id="updateBar" class="hidden"><span id="updateText"></span><button id="updateGo" type="button">Update</button><button id="updateLater" type="button" title="Hide for a week">Later</button></div>
    <div id="menu" title="Menu">&#8943;</div>
    <div id="grip" title="Drag to resize (or Ctrl+scroll)"></div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
